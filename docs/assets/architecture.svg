<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-label="DealRoom Security architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#0f172a; stroke:#334155; stroke-width:1.5; rx:12; }
      .label { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size:17px; fill:#e2e8f0; font-weight:600; }
      .sub { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size:13px; fill:#94a3b8; }
      .grp { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size:14px; fill:#38bdf8; font-weight:700; letter-spacing:1px; }
      .flow { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .panel { fill:#0e1730; stroke:#1e293b; stroke-width:1.5; rx:16; }
    </style>
  </defs>

  <rect width="1120" height="460" fill="url(#abg)"/>

  <!-- Group panels -->
  <rect class="panel" x="24" y="60" width="330" height="150"/>
  <rect class="panel" x="392" y="60" width="330" height="150"/>
  <rect class="panel" x="760" y="60" width="336" height="150"/>

  <text class="grp" x="44" y="42">1 · CONNECT &amp; SCAN</text>
  <text class="grp" x="412" y="42">2 · AUTO-ANSWER</text>
  <text class="grp" x="780" y="42">3 · CLOSE THE DEAL</text>
  <text class="grp" x="44" y="262">INTEGRATION DIRECTORY</text>

  <!-- Group 1 -->
  <rect class="box" x="44" y="86" width="140" height="52"/>
  <text class="label" x="114" y="117" text-anchor="middle">GitHub</text>
  <rect class="box" x="44" y="150" width="140" height="44"/>
  <text class="label" x="114" y="177" text-anchor="middle">AWS</text>
  <rect class="box" x="200" y="86" width="134" height="52"/>
  <text class="label" x="267" y="117" text-anchor="middle">Google WS</text>
  <rect class="box" x="200" y="150" width="134" height="44"/>
  <text class="label" x="267" y="177" text-anchor="middle">Scan runner</text>

  <path class="flow" d="M184 112 L200 112"/>
  <path class="flow" d="M184 172 L200 172"/>

  <!-- Group 2 -->
  <rect class="box" x="412" y="86" width="140" height="52"/>
  <text class="label" x="482" y="111" text-anchor="middle">CSV / XLSX</text>
  <text class="sub" x="482" y="128" text-anchor="middle">buyer questions</text>
  <rect class="box" x="572" y="86" width="132" height="52"/>
  <text class="label" x="638" y="111" text-anchor="middle">Match</text>
  <text class="sub" x="638" y="128" text-anchor="middle">→ controls</text>
  <rect class="box" x="412" y="150" width="292" height="44"/>
  <text class="label" x="558" y="177" text-anchor="middle">Draft evidence-backed answers</text>

  <path class="flow" d="M552 112 L572 112"/>
  <path class="flow" d="M638 138 L638 150"/>

  <!-- Group 3 -->
  <rect class="box" x="780" y="86" width="296" height="44"/>
  <text class="label" x="928" y="113" text-anchor="middle">Review &amp; approve</text>
  <rect class="box" x="780" y="150" width="140" height="44"/>
  <text class="label" x="850" y="177" text-anchor="middle">Export CSV</text>
  <rect class="box" x="936" y="150" width="140" height="44"/>
  <text class="label" x="1006" y="177" text-anchor="middle">Trust page</text>
  <path class="flow" d="M850 130 L850 150"/>
  <path class="flow" d="M928 130 L1006 150"/>

  <!-- group connectors -->
  <path class="flow" d="M722 108 L760 108"/>
  <path class="flow" d="M354 130 L392 130"/>

  <!-- Directory strip -->
  <rect class="panel" x="24" y="290" width="1072" height="140"/>
  <rect class="box" x="48" y="322" width="150" height="80"/>
  <text class="label" x="123" y="356" text-anchor="middle">Controls</text>
  <text class="sub" x="123" y="378" text-anchor="middle">10 SOC2-style</text>
  <rect class="box" x="218" y="322" width="150" height="80"/>
  <text class="label" x="293" y="356" text-anchor="middle">FastAPI</text>
  <text class="sub" x="293" y="378" text-anchor="middle">REST + SQLite</text>
  <rect class="box" x="388" y="322" width="150" height="80"/>
  <text class="label" x="463" y="356" text-anchor="middle">React + Vite</text>
  <text class="sub" x="463" y="378" text-anchor="middle">TypeScript UI</text>
  <rect class="box" x="558" y="322" width="150" height="80"/>
  <text class="label" x="633" y="356" text-anchor="middle">Docker</text>
  <text class="sub" x="633" y="378" text-anchor="middle">compose + nginx</text>
  <rect class="box" x="728" y="322" width="150" height="80"/>
  <text class="label" x="803" y="356" text-anchor="middle">Tests</text>
  <text class="sub" x="803" y="378" text-anchor="middle">50 + 9</text>
  <rect class="box" x="898" y="322" width="174" height="80"/>
  <text class="label" x="985" y="356" text-anchor="middle">Evidence</text>
  <text class="sub" x="985" y="378" text-anchor="middle">live scan proof</text>
</svg>
