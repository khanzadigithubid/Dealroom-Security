services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/dealroom.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FRONTEND_URL: http://localhost:8080
    volumes:
      - dealroom-data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dealroom-data:
